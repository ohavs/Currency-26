name: Play listing

# Uploads the Google Play store page from store/listing: texts in 13 languages (tools/store/listing.py),
# screenshots and feature graphic (tools/store/screenshots.mjs) and the icon. Run it by hand (Actions >
# Play listing > Run workflow) after they change. Needs the PLAY_SERVICE_ACCOUNT_JSON secret, and the app's
# first bundle uploaded once in Play Console.
# fastlane ties the listing to a release on a track (default: production, which is empty until launch), so
# it is pointed at the closed test track and its newest version code (looked up unless given).
on:
  workflow_dispatch:
    inputs:
      track:
        description: Track that has a release (alpha = closed test)
        default: alpha
      version_code:
        description: Version code of a release on that track (empty = the newest)
        default: ''

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Sister locales get their language's images
        run: |
          for pair in en-GB:en-US es-419:es-ES fr-CA:fr-FR pt-PT:pt-BR; do
            cp -r "store/listing/${pair#*:}/images" "store/listing/${pair%%:*}/"
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Add the PLAY_SERVICE_ACCOUNT_JSON secret first (see docs/PLAY_LAUNCH_PLAN.md)."
            exit 1
          fi
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          TRACK="${{ inputs.track || 'alpha' }}"
          CODE="${{ inputs.version_code }}"
          if [ -z "$CODE" ]; then
            CODE=$(KEY="$RUNNER_TEMP/play.json" TRACK="$TRACK" ruby -e '
              require "supply"
              Supply.config = FastlaneCore::Configuration.create(Supply::Options.available_options,
                { package_name: "com.ohav.currency", json_key: ENV["KEY"] })
              client = Supply::Client.make_from_config
              client.begin_edit(package_name: "com.ohav.currency")
              codes = client.tracks(ENV["TRACK"]).flat_map { |t| (t.releases || []).flat_map { |r| r.version_codes || [] } }
              client.abort_current_edit
              puts codes.map(&:to_i).max' | tail -n 1)
          fi
          if ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::No release found on track '$TRACK'."
            exit 1
          fi
          echo "Listing goes with version code $CODE on track $TRACK"
          fastlane supply \
            --package_name com.ohav.currency \
            --json_key "$RUNNER_TEMP/play.json" \
            --metadata_path store/listing \
            --track "$TRACK" --version_code "$CODE" \
            --skip_upload_apk true --skip_upload_aab true --skip_upload_changelogs true \
            --sync_image_upload true
