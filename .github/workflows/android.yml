name: Android build

# Checks branches and pull requests; pushes to main are built and published by release.yml.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Opens the Play upload key from its secrets, when they exist, and prints its fingerprints to compare with
      # Play Console's "Upload key certificate" (expected SHA1 A0:25:F0:...:56:4B). Nothing secret is printed.
      - name: Upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then echo "No upload key secrets yet."; exit 0; fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/upload-key.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias upload \
            | grep -E "Alias name|SHA1:|SHA256:|Valid from"
          rm "$RUNNER_TEMP/upload-key.jks"

      # github = the owner's build (self-update, everything open); play = Google Play (ads, Premium, R8).
      - name: Build the GitHub APKs and the Play bundle
        # Test ads: these APKs are for trying out, and the real ids are for the store build only (release.yml).
        run: ./gradlew assembleGithubDebug assembleGithubRelease assemblePlayRelease bundlePlayRelease -PadmobTestAds=true

      - name: Permissions and sizes
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in app/build/outputs/apk/*/release/*.apk; do
            echo "== $apk $(du -h "$apk" | cut -f1)"
            "$AAPT" dump permissions "$apk"
            "$AAPT" dump xmltree --file AndroidManifest.xml "$apk" | grep -o 'ca-app-pub-[0-9~]*' | sed 's/^/AdMob app id: /' || true
          done
          ls -la app/build/outputs/bundle/playRelease/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: currency-26-apks
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/play/release/*.apk

      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
