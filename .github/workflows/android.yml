name: Android build

# Checks branches and pull requests; pushes to main are built and published by release.yml.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # github = the owner's build (self-update, everything open); play = Google Play (ads, Premium, R8).
      - name: Build the GitHub APKs and the Play bundle
        run: ./gradlew assembleGithubDebug assembleGithubRelease assemblePlayRelease bundlePlayRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: currency-26-apks
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/play/release/*.apk

      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
