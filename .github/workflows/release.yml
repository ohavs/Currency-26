name: Release

# Every push to main publishes a numbered GitHub release with the APK (the GitHub build: the app's in-app
# updater installs the latest one), and builds the Google Play bundle with the same version. Once the Play
# secrets are in place (see docs/PLAY_LAUNCH_PLAN.md) the bundle also goes to Google Play's internal test track.
on:
  push:
    branches: [main]
    # Notes, the store page, the site and the other workflows ship nothing: no release for them.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - 'store/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/play-listing.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:
    inputs:
      github_release:
        description: "Also publish a GitHub release (off: only build the Play bundle, e.g. to check the upload key)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || inputs.github_release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          echo "code=$((500 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=5.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Test and build release APK
        run: >
          ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest assembleGithubRelease
          -PappVersionCode=${{ steps.version.outputs.code }}
          -PappVersionName=${{ steps.version.outputs.name }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "currency-26-$VERSION.apk"
          gh release create "v$VERSION" "currency-26-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "גרסה $VERSION" \
            --generate-notes

  play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Draft until the app's first release is reviewed (Google Play only accepts drafts for a new app);
      # then "completed", so each push to main reaches the internal testers by itself.
      PLAY_TRACK: internal
      PLAY_STATUS: draft
    steps:
      - uses: actions/checkout@v4

      - name: Upload key
        id: key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::notice::No UPLOAD_KEYSTORE_BASE64 secret yet: the Play bundle is not built (see docs/PLAY_LAUNCH_PLAN.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/upload-key.jks"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"; fi
          if ! grep -q '^admobAppId=' gradle.properties; then
            echo "::warning::gradle.properties has no AdMob ids: this bundle shows Google's test ads."
          fi

      - uses: actions/setup-java@v4
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.ready == 'true'

      - name: Build the Play bundle
        if: steps.key.outputs.ready == 'true'
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: >
          ./gradlew bundlePlayRelease
          -PappVersionCode=$((500 + GITHUB_RUN_NUMBER))
          -PappVersionName=5.0.${GITHUB_RUN_NUMBER}

      - name: AdMob ids in the bundle
        if: steps.key.outputs.ready == 'true'
        run: |
          id=$(unzip -p app/build/outputs/bundle/playRelease/app-play-release.aab base/manifest/AndroidManifest.xml | grep -ao 'ca-app-pub-[0-9~]*' | head -1)
          echo "AdMob app id: $id"
          case "$id" in *3940256099942544*) echo "::warning::This bundle carries Google's test ads.";; esac

      - name: Keep the bundle
        if: steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: currency-26-play-bundle
          path: |
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/mapping/playRelease/mapping.txt

      - name: Send to Google Play
        if: steps.key.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ohav.currency
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          mappingFile: app/build/outputs/mapping/playRelease/mapping.txt
          releaseName: 5.0.${{ github.run_number }}
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}
