name: Smoke test

# Runs the Play build (minified, test ads) on an emulator: start, Settings, Premium, a rewarded video, the
# quick-convert bubble. Fails on a crash; screenshots are in the artifact and, shrunk, in the last step's log.
on:
  push:
    branches-ignore: [main]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', '.github/smoke/**', '.github/workflows/smoke.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Play APK
        run: ./gradlew assemblePlayRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/smoke/run.sh app/build/outputs/apk/play/release/app-play-release.apk

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke/

      - name: Screenshots in the log
        if: always()
        run: |
          pip install --quiet pillow
          python3 .github/smoke/shots.py
